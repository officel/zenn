---
# Original: https://pre-commit.com/
# Recommended: https://prek.j178.dev/

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac  # frozen: v1.9.0
    hooks:
      - id: betterleaks

  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # frozen: v1.17.0
    hooks:
      - id: actionlint

  - repo: https://github.com/jdx/jactionlint
    rev: baa8d685e2b27ff5821558c9eeabb2051c1da61b  # frozen: v2.4.0
    hooks:
      - id: jactionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: b0cff962ee693b9e612c097d22e71e0cba127447  # frozen: v0.3.2
    hooks:
      - id: rumdl
        args: ["--fix"]
      - id: rumdl-fmt

  - repo: https://github.com/owenlamont/ryl-pre-commit
    rev: ba2d2344c24a99c2e87325bb4f9b966692ff3c53  # frozen: v0.28.0
    hooks:
      - id: ryl-check
        args: ["--fix"]
        types_or: [yaml, markdown]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
