---
# Original: https://pre-commit.com/
# Recommended: https://prek.j178.dev/

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac  # frozen: v1.9.0
    hooks:
      - id: betterleaks

  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # frozen: v1.17.0
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 83cecb6b523a053d7d3dfdc4798d705b505a88f9  # frozen: v0.2.78
    hooks:
      - id: rumdl
        args: ["--fix"]
      - id: rumdl-fmt

  - repo: https://github.com/owenlamont/ryl-pre-commit
    rev: fc067094423fc9c08be5c87f4424cde335ef4422  # frozen: v0.22.0
    hooks:
      - id: ryl
        types_or: [yaml, markdown]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
